spring.application.name=casino-platform
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.jwt.expiration=86400000
app.reset-password.expiration-minutes=30
app.reset-password.url=http://localhost:3000/reset-password
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback
app.mail.from=no-reply@casino-platform.local
spring.config.import=optional:application-secret.properties
